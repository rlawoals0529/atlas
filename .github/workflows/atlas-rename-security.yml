name: Atlas rename and security pass

on:
  push:
    branches: [rename-atlas]
    paths:
      - scripts/apply-atlas-branding.mjs
      - .github/workflows/atlas-rename-security.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rename-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Atlas branding
        run: node scripts/apply-atlas-branding.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate data and generated artifacts
        run: |
          npm run data:validate
          npm run data:report
          npm run data:seed
          test -s generated/data-report.json
          test -s generated/catalog-seed.sql
      - name: Typecheck build and Worker dry-run
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check secret hygiene regressions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' -E '(CLOUDFLARE_API_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY)[[:space:]]*=[[:space:]]*[^$<]' .
      - name: Commit validated rename
        run: |
          rm -f scripts/apply-atlas-branding.mjs .github/workflows/atlas-rename-security.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Atlas branding and security baseline"
          git pull --rebase origin rename-atlas
          git push origin HEAD:rename-atlas
