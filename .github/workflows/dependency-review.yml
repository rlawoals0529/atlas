name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Explain unavailable dependency review
        if: steps.review.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Dependency review unavailable"
            echo "GitHub Dependency Graph is not enabled for this repository, so the dependency-diff API cannot run yet."
            echo "Enable **Settings → Security & analysis → Dependency graph** to turn this workflow into a blocking high/critical advisory gate."
            echo
            echo "Atlas CI still runs `npm audit --omit=dev --audit-level=high` on every PR."
          } >> "$GITHUB_STEP_SUMMARY"
