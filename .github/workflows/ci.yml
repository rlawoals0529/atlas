name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo '::warning::package-lock.json is not committed; using npm install until the lockfile is restored.'
            npm install --no-audit --no-fund
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate canonical catalog shards
        run: npm run data:validate
      - name: Generate catalog quality report
        run: npm run data:report
      - name: Generate SQL seed artifact
        run: npm run data:seed
      - name: Verify generated artifacts
        run: |
          test -s generated/data-report.json
          test -s generated/catalog-seed.sql
      - name: Typecheck, build, and validate Worker bundle
        run: npm run check
