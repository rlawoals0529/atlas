name: Input Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate canonical catalog shards
        run: npm run data:validate
      - name: Generate SQL seed artifact
        run: npm run data:seed
      - name: Verify generated seed is non-empty
        run: test -s generated/catalog-seed.sql
      - name: Typecheck, build, and validate Worker bundle
        run: npm run check
