name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate canonical catalog shards
        run: npm run data:validate
      - name: Validate community evidence pilot
        run: npm run community:validate
      - name: Validate Product Lab integrity rules
        run: npm run product:validate
      - name: Generate catalog quality report
        run: npm run data:report
      - name: Generate SQL seed artifact
        run: npm run data:seed
      - name: Verify generated artifacts
        run: |
          test -s generated/data-report.json
          test -s generated/catalog-seed.sql
      - name: Typecheck, build, and validate Worker bundle
        run: npm run check
