name: Input Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate canonical catalog
        run: npm run data:validate
      - name: Regenerate D1 seed
        run: npm run data:seed
      - name: Ensure generated seed is committed
        run: git diff --exit-code -- migrations/0002_seed.sql
      - name: Typecheck and build
        run: npm run build
