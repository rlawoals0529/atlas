name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run Worker API contract tests
        run: npm test
      - name: Generate and validate CycloneDX SBOM
        run: npm run sbom:generate
      - name: Validate release metadata contract
        run: npm run release:validate
      - name: Validate canonical catalog shards
        run: npm run data:validate
      - name: Validate community evidence pilots
        run: npm run community:validate
      - name: Validate sensitivity conversion data
        run: npm run sensitivity:validate
      - name: Validate Product Lab integrity rules
        run: npm run product:validate
      - name: Validate product media coverage
        run: npm run media:validate
      - name: Validate external switch review index
        run: npm run switch-index:validate
      - name: Validate attributed score snapshots
        run: npm run scores:validate
      - name: Validate modal accessibility invariants
        run: npm run a11y:validate
      - name: Validate static-site security headers
        run: npm run headers:validate
      - name: Validate public discovery metadata
        run: npm run public:validate
      - name: Validate deployment verifier syntax
        run: |
          node --check scripts/verify-deployed-health.mjs
          node --check scripts/verify-deployed-media.mjs
          node --check scripts/verify-deployed-public-surface.mjs
          node --check scripts/check-source-health.mjs
      - name: Generate catalog quality report
        run: npm run data:report
      - name: Generate SQL seed artifact
        run: npm run data:seed
      - name: Verify generated artifacts
        run: |
          test -s generated/data-report.json
          test -s generated/catalog-seed.sql
          test -s generated/sbom.cdx.json
      - name: Typecheck, build, and validate Worker bundle
        run: npm run check
      - name: Enforce initial bundle budget
        run: npm run bundle:validate
      - name: Install isolated layout-test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          google-chrome --version
      - name: Check desktop and narrow layouts
        env:
          ATLAS_BROWSER_TOOLS: ${{ runner.temp }}/atlas-browser
        run: |
          npm run dev:ui -- --port 4173 > /tmp/atlas-layout-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-layout.mjs
      - name: Upload layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-layout-captures
          path: qa-evidence/layout/
          if-no-files-found: ignore
