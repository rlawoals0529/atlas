name: Generate npm lockfile

on:
  push:
    branches:
      - infra/npm-lockfile
    paths:
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Generate lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/generate-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/generate-lockfile.yml
          git commit -m "Add generated npm lockfile"
          git push origin HEAD:infra/npm-lockfile
