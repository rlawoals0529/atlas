name: Prepare Atlas v0.9.1 package version

on:
  push:
    branches:
      - release/v0.9.1-prep
    paths:
      - .github/workflows/prepare-v0.9.1.yml

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Update package version without running scripts
        run: npm version 0.9.1 --no-git-tag-version --ignore-scripts
      - name: Commit generated version metadata and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v0.9.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/prepare-v0.9.1.yml
          git commit -m "Bump package version to 0.9.1"
          git push origin HEAD:release/v0.9.1-prep
