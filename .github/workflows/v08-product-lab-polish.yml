name: Apply Atlas v0.8 Product Lab polish

on:
  push:
    branches: [feature/product-lab-v08]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/product-lab-v08
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/apply-v08-product-lab-polish.mjs
      - name: Remove one-time patch machinery
        run: rm scripts/apply-v08-product-lab-polish.mjs .github/workflows/v08-product-lab-polish.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react-app/ProductLab.tsx src/react-app/AppV05.tsx scripts/apply-v08-product-lab-polish.mjs .github/workflows/v08-product-lab-polish.yml
          git commit -m "Polish Atlas Product Lab and validation workflow"
          git push origin HEAD:feature/product-lab-v08
