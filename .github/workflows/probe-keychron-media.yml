name: Probe Keychron media

on:
  push:
    branches:
      - ops/probe-keychron-media
    paths:
      - .github/workflows/probe-keychron-media.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Probe official product pages
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const pages = [
            ["Q1 HE 8K", "https://www.keychron.com/products/keychron-q1-he-8k-magnetic-switch-keyboard"],
            ["K2 HE", "https://www.keychron.com/products/keychron-k2-he-wireless-magnetic-switch-keyboard"],
            ["Q3 HE 8K", "https://www.keychron.com/products/keychron-q3-he-8k-magnetic-switch-keyboard"],
          ];
          for (const [name, url] of pages) {
            const response = await fetch(url, { headers: { "user-agent": "Mozilla/5.0 (compatible; AtlasMediaProbe/1.0)", accept: "text/html" } });
            const html = await response.text();
            const meta = [...html.matchAll(/<meta\b[^>]*>/gi)]
              .map(m => m[0])
              .filter(tag => /(?:og:image|twitter:image)/i.test(tag));
            const imgs = [...html.matchAll(/<img\b[^>]*>/gi)]
              .map(m => m[0])
              .filter(tag => /keychron|q1|q3|k2|keyboard/i.test(tag))
              .slice(0, 12);
            console.log("\n###", name, response.status, response.url);
            for (const tag of meta) console.log("META", tag.replace(/\s+/g, " "));
            for (const tag of imgs) console.log("IMG", tag.replace(/\s+/g, " ").slice(0, 1400));
          }
          NODE
