name: Deploy Atlas

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Atlas CI"]
    types: [completed]
    branches: [main]

env:
  NODE_VERSION: 22

permissions:
  contents: read

concurrency:
  group: atlas-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate catalog, evidence, utilities and Worker bundle
        run: |
          npm run release:validate
          npm run data:validate
          npm run community:validate
          npm run sensitivity:validate
          npm run product:validate
          npm run media:validate
          npm run headers:validate
          npm run public:validate
          npm run data:report
          npm run data:seed
          test -s generated/data-report.json
          test -s generated/catalog-seed.sql
          npm run check
      - name: Detect Cloudflare deployment credentials
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Atlas Workers deployment skipped"
              echo "Cloudflare credentials are not configured for this repository."
              echo "Add \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` as repository secrets, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to Cloudflare Workers
        id: deploy
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/atlas-wrangler-deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/atlas-wrangler-deploy.log | tail -n 1 || true)"
          if [[ -z "$DEPLOY_URL" ]]; then
            echo "Wrangler completed without a detectable workers.dev URL." >&2
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Atlas live deployment"
            echo "- $DEPLOY_URL"
            echo "- Keyboard Lab: ${DEPLOY_URL}/#keyboard-lab"
            echo "- Sensitivity Lab: ${DEPLOY_URL}/#sensitivity"
            echo "- Product Lab: ${DEPLOY_URL}/#product-lab"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed release and health endpoint
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          node scripts/verify-deployed-health.mjs "${{ steps.deploy.outputs.url }}" | tee /tmp/atlas-health-verification.log
          {
            echo
            echo "Health check: PASS — deployed release metadata matches this repository checkout."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed product media fallbacks
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          node scripts/verify-deployed-media.mjs "${{ steps.deploy.outputs.url }}" | tee /tmp/atlas-media-verification.log
          echo "Product media probes: PASS — every catalog product using the official-source fallback returned an image response." >> "$GITHUB_STEP_SUMMARY"
