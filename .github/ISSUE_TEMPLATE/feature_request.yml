name: Feature request
description: Suggest a product or research workflow improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user task or research gap before proposing UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Data / evidence implications
      description: Note any new measurements, third-party data, privacy, licensing, or provenance requirements.
  - type: textarea
    id: acceptance
    attributes:
      label: Useful acceptance criteria
      placeholder: "What would make this complete and verifiable?"
